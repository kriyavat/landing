<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Primary Meta Tags -->
		<title>%sveltekit.env.PUBLIC_SITE_TITLE%</title>
		<meta name="title" content="%sveltekit.env.PUBLIC_SITE_TITLE%" />
		<meta name="description" content="%sveltekit.env.PUBLIC_SITE_DESCRIPTION%" />
		<meta name="keywords" content="%sveltekit.env.PUBLIC_SITE_KEYWORDS%" />
		<meta name="author" content="Kriyavat Labs" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="%sveltekit.env.PUBLIC_SITE_URL%" />
		<meta property="og:title" content="%sveltekit.env.PUBLIC_SITE_TITLE%" />
		<meta property="og:description" content="%sveltekit.env.PUBLIC_SITE_DESCRIPTION%" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/meta-tag-kl.png" />
		
		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="%sveltekit.env.PUBLIC_SITE_URL%" />
		<meta property="twitter:title" content="%sveltekit.env.PUBLIC_SITE_TITLE%" />
		<meta property="twitter:description" content="%sveltekit.env.PUBLIC_SITE_DESCRIPTION%" />
		<meta property="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/meta-tag-kl.png" />
		
		<!-- Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=%sveltekit.env.PUBLIC_GA_MEASUREMENT_ID%"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', '%sveltekit.env.PUBLIC_GA_MEASUREMENT_ID%');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
